<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>LinkedIn icon — custovox.ai</title>
<!--
  Source of images/linkedin_icon.png (400 x 400), used as og:image on every page.
  Regenerate: open this file in a browser and take a 400 x 400 screenshot of the top-left corner,
  or run headless Chrome (window 600x500) and crop the top-left 400x400.
  The mark is images/favicon-192.png (teal bubble, transparent): images/logo.png has an opaque
  white background, a black icon and already contains the "custovox.ai" wordmark.
-->
<style>
  :root { --navy: #0D2B6B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #FFFFFF; }
  .icon { width: 400px; height: 400px; background: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .icon img { display: block; height: 80px; width: auto; }
  .icon span { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 24px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.2px; line-height: 1; }
</style>
</head>
<body>
  <div class="icon">
    <img src="images/favicon-192.png" alt="">
    <span>custovox.ai</span>
  </div>
</body>
</html>
