[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custovox-review-analyzer"
version = "1.0.0"
description = "Customer review analysis MCP: sentiment breakdown, key themes, actionable insights. Multilingual. By CustoVox.ai"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jérémie Muselet", email = "jeremie@custovox.ai"}]
keywords = ["mcp","review-analysis","nlp","customer-experience","sentiment","custovox"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0","transformers>=4.40.0","torch>=2.0.0"]

[project.urls]
Homepage = "https://custovox.ai"
Repository = "https://github.com/jeremdecustovox/custovox-ai"

[project.scripts]
custovox-review-analyzer = "server:mcp.run"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
