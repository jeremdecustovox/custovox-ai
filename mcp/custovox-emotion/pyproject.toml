[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custovox-emotion"
version = "1.0.0"
description = "6-emotion detection MCP server for customer text. Joy, anger, fear, sadness, surprise, disgust. By CustoVox.ai"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jérémie Muselet", email = "jeremie@custovox.ai"}]
keywords = ["mcp","emotion-detection","nlp","customer-experience","transformers","custovox"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0","transformers>=4.40.0","torch>=2.0.0"]

[project.urls]
Homepage = "https://custovox.ai"
Repository = "https://github.com/jeremdecustovox/custovox-ai"

[project.scripts]
custovox-emotion = "server:mcp.run"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
