[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custovox-ticket-scorer"
version = "1.0.0"
description = "Support ticket scoring MCP: priority + category + sentiment + escalation risk. Multilingual sentiment. By custovox.ai"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jérémie Muselet", email = "jeremie@custovox.ai"}]
keywords = ["mcp","ticket-scoring","nlp","customer-support","zero-shot","custovox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0,<2","transformers>=4.40.0","torch>=2.0.0"]

[project.urls]
Homepage = "https://custovox.ai"
Repository = "https://github.com/jeremdecustovox/custovox-ai"
Documentation = "https://custovox.ai"

[project.scripts]
custovox-ticket-scorer = "custovox_ticket_scorer.server:mcp.run"

# Installed as custovox_ticket_scorer/server.py so it does not overwrite the
# top-level server.py of the other custovox MCP packages.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "custovox_ticket_scorer/server.py"
