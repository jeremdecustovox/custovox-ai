<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Thank you — CustoVox.ai</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy: #0D2B6B; --teal: #00C48C; --teal-dark: #009E72; --gray-200: #E2E8F0; --gray-400: #94A3B8; --gray-600: #475569; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FFFFFF; color: var(--navy);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
  .card {
    max-width: 520px; width: 100%; text-align: center;
    border: 1px solid var(--gray-200); border-radius: 14px; overflow: hidden;
  }
  .card-head { background: var(--navy); color: white; padding: 2rem 1.5rem 1.75rem; }
  .check {
    width: 56px; height: 56px; border-radius: 50%; background: var(--teal);
    display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;
  }
  .card-head h1 { font-size: 26px; font-weight: 800; }
  .card-body { padding: 1.75rem 1.5rem 2rem; }
  .card-body p { font-size: 15px; color: var(--gray-600); line-height: 1.7; margin-bottom: 1.5rem; }
  .card-body strong { color: var(--navy); }
  .btn-home {
    display: inline-block; background: var(--teal); color: var(--navy); font-weight: 700; font-size: 14px;
    padding: 12px 22px; border-radius: 8px; text-decoration: none; transition: background 0.15s;
  }
  .btn-home:hover { background: #00B07C; }
  .blog-link { display: block; margin-top: 1rem; font-size: 13px; color: var(--teal-dark); text-decoration: none; }
  footer { text-align: center; padding: 2rem; color: var(--gray-400); font-size: 13px; border-top: 1px solid var(--gray-200); }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="card-head">
      <span class="check" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0D2B6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      <h1>Thank you, your message has been sent!</h1>
    </div>
    <div class="card-body">
      <p>We've received your message. The <strong>CustoVox.ai</strong> team will reply <strong>within 48h</strong>.</p>
      <a href="/" class="btn-home">← Back to home</a>
      <a href="/blog/" class="blog-link">In the meantime, read our analyses on the blog →</a>
    </div>
  </div>
</main>
<footer>© 2026 CustoVox.ai — Listen deeper. Act faster.</footer>
</body>
</html>
