<!DOCTYPE html>

<head>

<title>Merci — CustoVox.ai</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy: #0D2B6B; --teal: #00C48C; --teal-dark: #009E72; --gray-200: #E2E8F0; --gray-400: #94A3B8; --gray-600: #475569; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FFFFFF; color: var(--navy);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .site-nav { width: 100%; max-width: 860px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .site-nav .brand { font-size: 22px; font-weight: 700; color: var(--teal); text-decoration: none; }
  .site-nav .brand span { color: var(--navy); }
  .site-nav .right { display: flex; align-items: center; gap: 1.25rem; }
  .site-nav .right > a { color: var(--navy); text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; }
  .lang { display: flex; gap: 10px; font-size: 12px; }
  .lang a { color: var(--gray-400); text-decoration: none; font-weight: 500; }
  .lang a.active { color: var(--navy); font-weight: 700; border-bottom: 2px solid var(--teal); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
  .card {
    max-width: 520px; width: 100%; text-align: center;
    border: 1px solid var(--gray-200); border-radius: 14px; overflow: hidden;
  }
  .card-head { background: var(--navy); color: white; padding: 2rem 1.5rem 1.75rem; }
  .check {
    width: 56px; height: 56px; border-radius: 50%; background: var(--teal);
    display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;
  }
  .card-head h1 { font-size: 26px; font-weight: 800; }
  .card-body { padding: 1.75rem 1.5rem 2rem; }
  .card-body p { font-size: 15px; color: var(--gray-600); line-height: 1.7; margin-bottom: 1.5rem; }
  .card-body strong { color: var(--navy); }
  .btn-home {
    display: inline-block; background: var(--teal); color: var(--navy); font-weight: 700; font-size: 14px;
    padding: 12px 22px; border-radius: 8px; text-decoration: none; transition: background 0.15s;
  }
  .btn-home:hover { background: #00B07C; }
  .blog-link { display: block; margin-top: 1rem; font-size: 13px; color: var(--teal-dark); text-decoration: none; }
  footer { text-align: center; padding: 2rem; color: var(--gray-400); font-size: 13px; border-top: 1px solid var(--gray-200); }
</style>
</head>
<body>
<nav class="site-nav">

    <a href="/fr/blog/">Blog</a>
    <a href="/fr/faq">FAQ</a>
    <div class="lang">
      <a href="/thank-you.html" hreflang="en" title="English">EN</a>
      <a href="/merci.html" hreflang="fr" title="Français" class="active" aria-current="true">FR</a>
    </div>
  </div>
</nav>
<main>
  <div class="card">
    <div class="card-head">
      <span class="check" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0D2B6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      <h1>Merci, votre message est bien envoyé&nbsp;!</h1>
    </div>
    <div class="card-body">
      <p>Nous avons bien reçu votre message. L'équipe <strong>CustoVox.ai</strong> vous répond <strong>sous 48&nbsp;h</strong>.</p>
      <a href="/fr/" class="btn-home">← Retour à l'accueil</a>
      <a href="/fr/blog/" class="blog-link">En attendant, découvrez nos analyses sur le blog →</a>
    </div>
  </div>
</main>
<footer>© 2026 CustoVox.ai — Listen deeper. Act faster.</footer>

</html>
